name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Lint (compile check)
        run: python -m compileall -q app
      - name: Unit tests (no database required)
        run: pytest tests/unit -v
      # Integration, API, evaluation, and security tests connect to a real SQL Server
      # (SalesAI_DB). They are not run here because this hosted runner has no such
      # database; run them locally or against a provisioned SQL Server instance
      # before deploying. See docs/deployment.md for CI-with-database options.

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - name: Build Docker image
        run: docker build -t enterprise-ai-data-copilot:ci .
